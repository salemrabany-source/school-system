<!DOCTYPE html>
<html dir="rtl">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {

  margin:0;

  min-height:100vh;

  font-family:'Cairo', Arial, sans-serif;

  background:linear-gradient(
    135deg,
    #e8f5e9,
    #e3f2fd
  );

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

}



.card {

  width:100%;

  max-width:500px;

  background:white;

  border-radius:25px;

  padding:30px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.15);

  border-top:6px solid #1976d2;

}



h1 {

 text-align:center;

 color:#1565c0;

 font-size:26px;

}



h3 {

 color:#2e7d32;

 margin-top:25px;

}



label {

 display:block;

 margin-top:15px;

 color:#444;

 font-weight:bold;

}



input, textarea {

 width:100%;

 padding:12px;

 margin-top:8px;

 border-radius:12px;

 border:1px solid #ddd;

 box-sizing:border-box;

 font-size:15px;

}



textarea {

 height:120px;

 resize:none;

}



button {

 width:100%;

 margin-top:25px;

 padding:15px;

 border:none;

 border-radius:15px;

 background:#1976d2;

 color:white;

 font-size:18px;

 cursor:pointer;

}



button:hover {

 background:#0d47a1;

}



#result {

 margin-top:20px;

 text-align:center;

 color:#2e7d32;

 font-weight:bold;

}


</style>

</head>


<body>


<div class="card">


<h1>
إدارة نظام حضور الموظفين
</h1>



<h3>
🏫 إضافة مركز جديد
</h3>



<label>
اسم المركز
</label>

<input id="centerName">



<label>
رابط الموقع من خرائط Google
</label>

<input id="location">





<h3>
👤 بيانات المدير
</h3>



<label>
اسم المدير
</label>

<input id="manager">



<label>
البريد الإلكتروني
</label>

<input id="email">



<label>
رقم واتساب
</label>

<input id="whatsapp">





<h3>
👨‍🏫 الموظفون
</h3>



<label>
أدخل بيانات الموظفين (كل موظف في سطر)
<br>
الصيغة:
<br>
رقم الموظف, الاسم, الوظيفة
</label>


<textarea id="employees"></textarea>





<button onclick="addCenter()">

إضافة المركز

</button>




<div id="result"></div>



<button id="copyBtn"
style="display:none;"
onclick="copyLink()">

نسخ الرابط

</button>




</div>


<script>
function addCenter(){


let data = {


  centerName:
  document.getElementById("centerName").value,


  location:
  document.getElementById("location").value,


  manager:
  document.getElementById("manager").value,


  email:
  document.getElementById("email").value,


  whatsapp:
  document.getElementById("whatsapp").value,


  employees:
  document.getElementById("employees").value


};




fetch("https://script.google.com/macros/s/AKfycbwPBzaB_4XuvCiKO87Kcuc3G-VVpejIhRDKVLnPlS6CTDHfbADTwdXhfblvhbyCqO2w/exec", {


  method: "POST",


 headers: {
 "Content-Type": "text/plain"
},


  body: JSON.stringify({

    action: "addNewCenter",

    centerName: data.centerName,

    location: data.location,

    manager: data.manager,

    email: data.email,

    whatsapp: data.whatsapp,

    employees: data.employees

  })


})


.then(response => response.json())


.then(result => {

let html = `


<h3>
تم إضافة المركز بنجاح ✅
</h3>


<p>
رقم المركز:
<b>${result.data.id}</b>
</p>


<p>
كود الحضور:
</p>

<img 
src="https://quickchart.io/qr?size=1000&text=${encodeURIComponent(result.data.link)}"
width="250"
style="margin-top:10px;"
>

<p style="color:#555;font-size:14px;">
استخدم هذا الكود للدخول إلى صفحة تسجيل حضور المركز (اضغط مطولا على الصورة لتنزيلها)
</p>
`;

document.getElementById("result")

.innerHTML = html;

document.getElementById("copyBtn")

.style.display="block";



})


.catch(error => {


console.error(error);


alert("حدث خطأ في الاتصال");


});



}

function copyLink(){



let link =

document.getElementById("centerLink");



link.select();



navigator.clipboard.writeText(

link.value

);





document.getElementById("copyBtn")

.innerHTML="تم النسخ ✅";



}



</script>



</body>

</html>
