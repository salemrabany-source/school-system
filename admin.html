<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>لوحة إدارة الحضور</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --qatar: #8a1538;
      --qatar-dark: #64102a;
      --background: #f7f2f4;
      --border: #eadde2;
      --danger: #c92d43;
      --success: #14804a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #30252a;
      font-family: "Cairo", Arial, sans-serif;
      background: var(--background);
    }

    header {
      padding: 18px 5%;
      color: white;
      background: linear-gradient(
        135deg,
        var(--qatar),
        var(--qatar-dark)
      );
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 8px 24px rgba(100, 16, 42, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag {
      font-size: 34px;
    }

    .brand strong {
      display: block;
      font-size: 20px;
    }

    .brand small {
      display: block;
      opacity: 0.8;
    }

    .container {
      width: min(1160px, 94%);
      margin: 26px auto;
    }

    .toolbar,
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      margin-bottom: 20px;
    }

    h2 {
      color: var(--qatar-dark);
    }

    button,
    .button {
      padding: 10px 15px;
      font-family: inherit;
      font-weight: 700;
      text-decoration: none;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: var(--qatar);
    }

    .secondary {
      color: var(--qatar);
      background: white;
      border: 1px solid var(--border);
    }

    .danger {
      color: white;
      background: var(--danger);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .stats {
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat,
    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(100, 16, 42, 0.05);
    }

    .stat {
      padding: 18px;
    }

    .stat span {
      color: #75666c;
      font-size: 13px;
    }

    .stat strong {
      display: block;
      color: var(--qatar);
      font-size: 28px;
    }

    .panel {
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    input,
    select {
      padding: 10px 12px;
      font-family: inherit;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--qatar);
      box-shadow: 0 0 0 3px rgba(138, 21, 56, 0.09);
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 15px;
      text-align: right;
      border-bottom: 1px solid #f1e8eb;
    }

    th {
      color: #75666c;
      font-size: 13px;
      background: #fcfafb;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      padding: 35px;
      color: #75666c;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 18px;
      background: rgba(47, 17, 27, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .dialog {
      width: min(450px, 100%);
      padding: 23px;
      background: white;
      border-radius: 20px;
    }

    .dialog h3 {
      color: var(--qatar);
    }

    .field {
      margin: 13px 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field select {
      width: 100%;
    }

    .dialog-actions {
      margin-top: 19px;
      display: flex;
      gap: 8px;
    }

    .dialog-actions button {
      flex: 1;
    }

    #message {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: 360px;
      padding: 12px 16px;
      color: white;
      background: var(--success);
      border-radius: 11px;
      display: none;
    }

    #message.error {
      background: var(--danger);
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar .button,
      .panel-head input {
        width: 100%;
      }

      .brand strong {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <span class="flag">🇶🇦</span>

      <div>
        <strong>لوحة إدارة الحضور والانصراف</strong>
        <small>مراكز التحفيظ</small>
      </div>
    </div>

    <button
      type="button"
      class="secondary"
      onclick="loadDashboard()">
      ↻ تحديث
    </button>
  </header>

  <main class="container">

    <div class="toolbar">
      <h2>إدارة المراكز</h2>

      <a
        id="addLink"
        class="button primary">
        ＋ إضافة مركز جديد
      </a>
    </div>

    <section class="stats">

      <article class="stat">
        <span>عدد المراكز</span>
        <strong id="centersCount">—</strong>
      </article>

      <article class="stat">
        <span>عدد الموظفين</span>
        <strong id="employeesCount">—</strong>
      </article>

      <article class="stat">
        <span>الأجهزة المرتبطة</span>
        <strong id="devicesCount">—</strong>
      </article>

    </section>

    <section class="panel">

      <div class="panel-head">
        <strong>قائمة المراكز</strong>

        <input
          id="search"
          type="search"
          placeholder="بحث باسم أو رقم المركز"
        >
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم المركز</th>
              <th>اسم المركز</th>
              <th>المدير</th>
              <th>الموظفون</th>
              <th>واتساب</th>
              <th>الإجراءات</th>
            </tr>
          </thead>

          <tbody id="centersBody">
            <tr>
              <td colspan="6" class="empty">
                جاري تحميل البيانات...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>

  </main>

  <div id="deviceModal" class="modal">

    <div class="dialog">

      <h3>مسح ربط جهاز موظف</h3>

      <p>
        بعد المسح يستطيع الموظف ربط هاتفه الجديد
        عند أول تسجيل.
      </p>

      <div class="field">
        <label for="deviceCenter">المركز</label>

        <select id="deviceCenter">
          <option value="">اختر المركز</option>
        </select>
      </div>

      <div class="field">
        <label for="deviceEmployee">الموظف</label>

        <select id="deviceEmployee">
          <option value="">اختر المركز أولًا</option>
        </select>
      </div>

      <div class="dialog-actions">

        <button
          id="clearBtn"
          type="button"
          class="danger"
          onclick="clearDevice()">
          مسح الجوال
        </button>

        <button
          type="button"
          class="secondary"
          onclick="closeModal()">
          إلغاء
        </button>

      </div>

    </div>

  </div>

  <div id="message" role="status"></div>

  <script>
    "use strict";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwPBzaB_4XuvCiKO87Kcuc3G-VVpejIhRDKVLnPlS6CTDHfbADTwdXhfblvhbyCqO2w/exec";

    let centers = [];

    function formUrl(centerId = "") {
      const url = "center-form.html";

      if (!centerId) {
        return url;
      }

      return (
        url +
        "?center=" +
        encodeURIComponent(centerId)
      );
    }

    async function callAPI(data) {
      const response = await fetch(API_URL, {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data),

        redirect: "follow",

        cache: "no-store"
      });

      const text = await response.text();

      if (
        !response.ok ||
        /^\s*</.test(text)
      ) {
        throw new Error(
          "تعذر الاتصال بالخادم"
        );
      }

      let result;

      try {
        result = JSON.parse(text);
      } catch (error) {
        throw new Error(
          "استجابة الخادم ليست JSON"
        );
      }

      if (!result.success) {
        throw new Error(
          result.error ||
          "فشلت العملية"
        );
      }

      return result.data;
    }

    function notify(text, error = false) {
      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        error ? "error" : "";

      message.style.display = "block";

      clearTimeout(notify.timer);

      notify.timer = setTimeout(
        function () {
          message.style.display = "none";
        },
        4000
      );
    }

    function renderCenters(list) {
      const body =
        document.getElementById(
          "centersBody"
        );

      body.replaceChildren();

      if (!list.length) {
        body.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              لا توجد مراكز
            </td>
          </tr>
        `;

        return;
      }

      list.forEach(function (center) {
        const row =
          document.createElement("tr");

        const values = [
          center.id,
          center.name,
          center.manager || "—",
          center.employeeCount || 0,
          center.whatsapp || "—"
        ];

        values.forEach(function (value) {
          const cell =
            document.createElement("td");

          cell.textContent = value;
          row.appendChild(cell);
        });

        const actionsCell =
          document.createElement("td");

        const actions =
          document.createElement("div");

        actions.className = "actions";

        const editLink =
          document.createElement("a");

        editLink.className =
          "button secondary small";

        editLink.textContent = "تعديل";

        editLink.href =
          formUrl(center.id);

        const deviceButton =
          document.createElement("button");

        deviceButton.type = "button";

        deviceButton.className =
          "secondary small";

        deviceButton.textContent =
          "مسح جوال";

        deviceButton.onclick =
          function () {
            openDeviceModal(center.id);
          };

        actions.append(
          editLink,
          deviceButton
        );

        actionsCell.appendChild(actions);
        row.appendChild(actionsCell);
        body.appendChild(row);
      });
    }

    async function loadDashboard() {
      try {
        const data = await callAPI({
          action: "getAdminDashboard"
        });

        centers = data.centers || [];

        document
          .getElementById("centersCount")
          .textContent =
            data.centersCount || 0;

        document
          .getElementById("employeesCount")
          .textContent =
            data.employeesCount || 0;

        document
          .getElementById("devicesCount")
          .textContent =
            data.devicesCount || 0;

        renderCenters(centers);
        fillCenterSelect();

      } catch (error) {
        document
          .getElementById("centersBody")
          .innerHTML = `
            <tr>
              <td colspan="6" class="empty">
                تعذر تحميل البيانات
              </td>
            </tr>
          `;

        notify(error.message, true);
      }
    }

    function fillCenterSelect() {
      const select =
        document.getElementById(
          "deviceCenter"
        );

      select.replaceChildren(
        new Option(
          "اختر المركز",
          ""
        )
      );

      centers.forEach(function (center) {
        select.add(
          new Option(
            center.name +
            " - " +
            center.id,

            center.id
          )
        );
      });
    }

    async function loadEmployees() {
      const centerSelect =
        document.getElementById(
          "deviceCenter"
        );

      const employeeSelect =
        document.getElementById(
          "deviceEmployee"
        );

      const centerId =
        centerSelect.value;

      employeeSelect.replaceChildren(
        new Option(
          centerId
            ? "جاري التحميل..."
            : "اختر المركز أولًا",
          ""
        )
      );

      if (!centerId) {
        return;
      }

      try {
        const employees =
          await callAPI({
            action: "getEmployees",
            centerId: centerId
          });

        employeeSelect.replaceChildren(
          new Option(
            "اختر الموظف",
            ""
          )
        );

        employees.forEach(
          function (employee) {
            employeeSelect.add(
              new Option(
                employee.name +
                " - " +
                employee.id,

                employee.id
              )
            );
          }
        );

      } catch (error) {
        notify(error.message, true);
      }
    }

    function openDeviceModal(centerId) {
      const modal =
        document.getElementById(
          "deviceModal"
        );

      const centerSelect =
        document.getElementById(
          "deviceCenter"
        );

      modal.classList.add("open");
      centerSelect.value = centerId || "";

      loadEmployees();
    }

    function closeModal() {
      document
        .getElementById("deviceModal")
        .classList
        .remove("open");
    }

    async function clearDevice() {
      const centerId =
        document
          .getElementById(
            "deviceCenter"
          )
          .value;

      const employeeId =
        document
          .getElementById(
            "deviceEmployee"
          )
          .value;

      const button =
        document.getElementById(
          "clearBtn"
        );

      if (!centerId || !employeeId) {
        notify(
          "اختر المركز والموظف أولًا",
          true
        );

        return;
      }

      const confirmed = confirm(
        "هل تريد مسح الجهاز المرتبط بهذا الموظف؟"
      );

      if (!confirmed) {
        return;
      }

      button.disabled = true;

      try {
        const result =
          await callAPI({
            action:
              "clearEmployeeDevice",

            centerId: centerId,

            employeeId: employeeId
          });

        notify(
          result.message ||
          "تم مسح ربط الجوال"
        );

        closeModal();
        loadDashboard();

      } catch (error) {
        notify(error.message, true);

      } finally {
        button.disabled = false;
      }
    }

    document
      .getElementById("deviceCenter")
      .addEventListener(
        "change",
        loadEmployees
      );

    document
      .getElementById("search")
      .addEventListener(
        "input",
        function (event) {
          const query =
            event.target.value
              .trim()
              .toLowerCase();

          const filtered =
            centers.filter(
              function (center) {
                return (
                  String(center.id)
                    .toLowerCase()
                    .includes(query) ||

                  String(center.name)
                    .toLowerCase()
                    .includes(query)
                );
              }
            );

          renderCenters(filtered);
        }
      );

    document
      .getElementById("deviceModal")
      .addEventListener(
        "click",
        function (event) {
          if (
            event.target.id ===
            "deviceModal"
          ) {
            closeModal();
          }
        }
      );

    document
      .getElementById("addLink")
      .href = formUrl();

    loadDashboard();
  </script>

</body>
</html>
