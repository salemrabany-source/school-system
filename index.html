<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

font-family:'Cairo',Arial,sans-serif;

background:
linear-gradient(
135deg,
#006233,
#00853f,
#fcd116,
#d21034
);

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}



.card{

width:100%;
max-width:420px;

background:white;

border-radius:25px;

padding:35px 25px;

text-align:center;

box-shadow:0 15px 35px rgba(0,0,0,.25);

border-top:6px solid #006233;

}



.icon{

width:80px;
height:80px;

margin:auto;

border-radius:50%;

background:#e0f2fe;

display:flex;

align-items:center;
justify-content:center;

font-size:40px;

}



h1{

font-size:24px;

color:#164e63;

}



select,
input{

width:100%;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

font-size:17px;

font-family:'Cairo';

margin-bottom:15px;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:15px;

font-size:18px;

font-family:'Cairo';

cursor:pointer;

margin-top:12px;

color:white;

}



.start{

background:#16a34a;

}



.end{

background:#dc2626;

}



#temporaryBtn{

background:#f59e0b;

display:none;

}



#result{

margin-top:25px;

font-weight:bold;

color:#164e63;

}


.temp-overlay{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.4);

display:none;

justify-content:center;

align-items:center;

}



.temp-popup{

background:white;

padding:25px;

border-radius:25px;

width:85%;

max-width:350px;

text-align:center;

}



.temp-in{

background:#16a34a;

}



.temp-out{

background:#f97316;

}


</style>

</head>


<body>


<div class="card">


<div class="icon">
📍
</div>


<h1>
تسجيل حضور وانصراف الموظفين
</h1>


<div id="centerName"
style="
font-size:22px;
font-weight:bold;
color:#006233;
margin:15px 0;
">
</div>


<p>
اختر اسمك ثم سجل العملية
</p>


<select id="name"></select>


<select id="temporaryWorker" style="display:none"></select>


<button class="start" onclick="send('دخول')">
🟢 بدء الدوام
</button>


<button class="end" onclick="send('خروج')">
🔴 انتهاء الدوام
</button>


<button id="temporaryBtn" onclick="sendTemporary()">
تسجيل موظف مؤقت
</button>


<div id="result"></div>


</div>
<script>
function debug(message){

  console.log(message);

  document.getElementById("result").innerHTML = message;

}

const API_URL =
"https://script.google.com/macros/s/AKfycbwPBzaB_4XuvCiKO87Kcuc3G-VVpejIhRDKVLnPlS6CTDHfbADTwdXhfblvhbyCqO2w/exec";


// قراءة رقم المركز من الرابط

const params =
new URLSearchParams(window.location.search);


let centerId =
params.get("center") || "";



// معرف الجهاز

let deviceId =
localStorage.getItem("deviceId");


if(!deviceId){

deviceId =
Date.now()
+
"_"
+
Math.random()
.toString(36)
.substring(2);


localStorage.setItem(
"deviceId",
deviceId
);

}



let employeesList = [];

let temporaryEmployee = null;

let isSending = false;


// دالة اتصال موحدة مع Apps Script

function callAPI(data){
console.log("📌 CALL API DATA:", data);
return fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain"
},
body:JSON.stringify(data)

})

.then(async function(response){

let text = await response.text();

console.log("API Response:", text);

return JSON.parse(text);

});

}





// جلب بيانات المركز والموظفين

callAPI({

action:"getCenterData",

centerId:centerId

})

.then(function(response){


let data = response.data;


document.getElementById("centerName").innerHTML =
"📚 " + data.centerName;



employeesList = data.employees;



let select =
document.getElementById("name");


select.innerHTML="";



data.employees.forEach(function(employee){


let option =
document.createElement("option");


option.value =
employee.id;


option.textContent =
employee.name +
" - " +
employee.job;


option.dataset.name =
employee.name;


option.dataset.temp =
employee.temp || "";


select.appendChild(option);



});



checkTemporaryPermission();


})


.catch(function(error){

console.error(error);

document.getElementById("result").innerHTML =
"❌ تعذر تحميل البيانات";

});







function getSelectedEmployee(){


let select =
document.getElementById("name");


let option =
select.options[select.selectedIndex];


return {

id:option.value,

name:option.dataset.name

};

}






function checkTemporaryPermission(){


let select =
document.getElementById("name");


let option =
select.options[select.selectedIndex];


let button =
document.getElementById("temporaryBtn");


let tempSelect =
document.getElementById("temporaryWorker");



if(option && option.dataset.temp=="نعم"){


button.style.display="block";


}else{


button.style.display="none";


tempSelect.style.display="none";

tempSelect.innerHTML="";

temporaryEmployee=null;


}

}




document
.getElementById("name")
.addEventListener(
"change",
checkTemporaryPermission
);








function getCurrentLocation(successCallback){


navigator.geolocation.getCurrentPosition(


function(position){


successCallback(

position.coords.latitude,

position.coords.longitude

);


},


function(){


document.getElementById("result").innerHTML =
"⚠️ يجب السماح بالوصول إلى الموقع";


}


);


}







// تسجيل الدخول والخروج

function send(action){
if(isSending){
    return;
}

isSending = true;

let result =
document.getElementById("result");


let employee =
getSelectedEmployee();


result.innerHTML =
"⏳ جاري التسجيل...";



getCurrentLocation(function(latitude,longitude){



callAPI({

action:"saveAttendance",

centerId:centerId,

employeeId:employee.id,

employeeName:employee.name,

attendanceAction:action,

latitude:latitude,

longitude:longitude,

deviceId:deviceId

})


.then(function(response){


if(response.success){


result.innerHTML =
response.data;


}else{


result.innerHTML =
"❌ " + response.error;


}
isSending = false;

})


.catch(function(error){


console.error(error);


result.innerHTML =
"❌ حدث خطأ أثناء التسجيل";
isSending = false;

});


});


}









// اختيار موظف مؤقت

function sendTemporary(){


let tempSelect =
document.getElementById("temporaryWorker");



if(tempSelect.style.display=="none"){


tempSelect.innerHTML="";


let current =
getSelectedEmployee();


let select =
document.getElementById("name");



for(let i=0;i<select.options.length;i++){


let option =
select.options[i];


if(option.value != current.id){


let newOption =
document.createElement("option");


newOption.value =
option.value;


newOption.textContent =
option.textContent;


tempSelect.appendChild(newOption);


}


}



tempSelect.style.display="block";


document.getElementById("result").innerHTML =
"اختر الموظف ثم اضغط تسجيل مؤقت مرة أخرى";


return;


}




temporaryEmployee={

id:
tempSelect.value,


name:
tempSelect.options[
tempSelect.selectedIndex
]
.textContent
.split(" - ")[0]


};



document.getElementById("tempActionBox")
.style.display="flex";


}








function chooseTemporary(action){

if(isSending){
    return;
}

isSending = true;

document.getElementById("tempActionBox")
.style.display="none";



if(!temporaryEmployee){

document.getElementById("result").innerHTML =
"اختر الموظف أولاً";

return;

}



let result =
document.getElementById("result");


result.innerHTML =
"⏳ جاري التسجيل المؤقت...";



getCurrentLocation(function(latitude,longitude){



callAPI({

action:"saveAttendance",

centerId:centerId,

employeeId:temporaryEmployee.id,

employeeName:temporaryEmployee.name,

attendanceAction:action,

latitude:latitude,

longitude:longitude,

deviceId:deviceId,

registrationType:"مؤقت"

})


.then(function(response){


if(response.success){

result.innerHTML =
response.data;

}else{

result.innerHTML =
"❌ " + response.error;

}

isSending = false;


})


.catch(function(error){


console.error(error);


result.innerHTML =
"❌ حدث خطأ أثناء التسجيل المؤقت";

isSending = false;
});


});


}

</script>



<div id="tempActionBox" class="temp-overlay">


<div class="temp-popup">


<h3>
تسجيل مؤقت
</h3>


<p>
اختر نوع العملية
</p>


<button class="temp-in" onclick="chooseTemporary('دخول')">
🟢 دخول مؤقت
</button>


<button class="temp-out" onclick="chooseTemporary('خروج')">
🟠 خروج مؤقت
</button>


</div>


</div>



</body>

</html>
