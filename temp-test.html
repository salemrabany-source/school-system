<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار التسجيل المؤقت</title>
</head>

<body>

  <h3>اختبار التسجيل المؤقت</h3>

  <button onclick="openTemporary()">
    فتح التسجيل المؤقت
  </button>

  <script>

    function openTemporary() {

      const centerId =
        new URLSearchParams(window.location.search)
        .get("center") || "";

      const url =
        "https://script.google.com/macros/s/AKfycbwPBzaB_4XuvCiKO87Kcuc3G-VVpejIhRDKVLNPlS6CTDHfbADTwdXhfblvhbyCqO2w/exec"
        + "?center="
        + encodeURIComponent(centerId)
        + "&temp=1";

      window.location.href = url;

    }

  </script>

</body>
</html>
